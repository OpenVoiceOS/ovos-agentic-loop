name: Build Tests

on:
  pull_request:
    branches: [dev, master, main]
  workflow_dispatch:

jobs:
  build:
    uses: OpenVoiceOS/gh-automations/.github/workflows/build-tests.yml@dev
    secrets: inherit
    with:
      python_versions: '["3.10", "3.11", "3.12", "3.13", "3.14"]'
      install_extras: 'test'
      test_path: 'test'
      # NativeToolCallEngine needs the tool-calling contract (ToolCall, tools=,
      # supports_tools) and the real-stack e2e uses the modern ovos_openai_plugin
      # ChatEngine as its brain. Install both unreleased branches until they release.
      pre_install_pip: "git+https://github.com/OpenVoiceOS/ovos-plugin-manager@feat/agent-tool-calling git+https://github.com/OpenVoiceOS/ovos-openai-plugin@opm-agents"
