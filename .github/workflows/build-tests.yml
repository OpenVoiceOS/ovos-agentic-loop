name: Build Tests

on:
  pull_request:
    branches: [dev, master, main]
  workflow_dispatch:

jobs:
  build:
    uses: OpenVoiceOS/gh-automations/.github/workflows/build-tests.yml@dev
    secrets: inherit
    with:
      python_versions: '["3.10", "3.11", "3.12", "3.13", "3.14"]'
      install_extras: 'test'
      test_path: 'test'
      # The tool-calling contract (ToolCall, tools=, supports_tools) is now released in
      # ovos-plugin-manager>=2.7.0a1 (pinned in pyproject). The real-stack e2e still uses
      # the modern ovos_openai_plugin ChatEngine as its brain; install that branch until
      # ovos-openai-plugin's opm-agents migration releases.
      pre_install_pip: "git+https://github.com/OpenVoiceOS/ovos-openai-plugin@opm-agents"
