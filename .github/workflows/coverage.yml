name: Code Coverage

on:
  pull_request:
    branches: [dev]
  workflow_dispatch:

jobs:
  coverage:
    uses: OpenVoiceOS/gh-automations/.github/workflows/coverage.yml@dev
    secrets: inherit
    with:
      python_version: '3.11'
      coverage_source: 'ovos_agentic_loop'
      test_path: 'test/'
      test_extras: 'test'  # install .[test] (pulls the ovos-openai-plugin e2e brain)
      min_coverage: 0
